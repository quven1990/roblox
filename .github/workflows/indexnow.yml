name: IndexNow

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Pages then ping Bing
        run: node scripts/indexnow.mjs --wait
